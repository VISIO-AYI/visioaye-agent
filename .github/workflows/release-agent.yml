name: Release agent desktop

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (ex 0.1.3)'
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  build-and-sign:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Install WiX
        run: dotnet tool install --global wix

      - name: Build + MSI + manifest signé
        run: pnpm release
        env:
          VISIOAYE_UPDATE_SIGNING_KEY: ${{ secrets.VISIOAYE_UPDATE_SIGNING_KEY }}

      - name: Upload unsigned artifacts for SignPath
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: visioaye-agent-unsigned
          path: |
            builds/visioaye_agent_win_x64_*.msi
            builds/visioaye_agent_win_x64.exe

      - name: SignPath code signing
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORG_ID }}
          project-slug: visioaye-agent
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: builds-signed

      - name: Regenerate latest.json with signed MSI SHA
        run: |
          Copy-Item builds-signed\*.msi builds\ -Force
          Copy-Item builds-signed\*.exe builds\ -Force
          node scripts/generate-latest-json.mjs
        shell: pwsh
        env:
          VISIOAYE_UPDATE_SIGNING_KEY: ${{ secrets.VISIOAYE_UPDATE_SIGNING_KEY }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            builds/visioaye_agent_win_x64_*.msi
            builds/visioaye_agent_win_x64.exe
            builds/visioaye_agent_linux_x64
            builds/latest.json
            builds/latest.json.sig
          fail_on_unmatched_files: false
